# OpenWakeWord base training config (consumed by src/synthesize_clips.py + src/train_model.py).
# Max-quality base run. Outputs are versioned under data/models/<model_name>_<timestamp>/.
# Later fine-tunes reuse this base plus verified data/classified/ real clips.
model_name: "hey_oswald"

# Phrases that trigger detection. Single phrase, max data behind it.
target_phrase:
  - "hey oswald"

# Known confusables to explicitly suppress. Expand after first evaluate_model.py run.
custom_negative_phrases:
  - "hey wall"
  - "hey awesome"
  - "hey oscar"

# Synthetic TTS generation (synthesize_clips.py reads n_samples, n_samples_val, tts_batch_size).
n_samples: 50000
n_samples_val: 10000
tts_batch_size: 50

# Augmentation + training (train_model.py reads the rest).
augmentation_batch_size: 16
augmentation_rounds: 2
model_type: "dnn"
layer_size: 32
steps: 100000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
