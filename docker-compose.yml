name: wake-word

services:
  synth:
    build: .
    image: oww-pipeline:latest
    container_name: oww-synth
    volumes:
      - ./data:/work/data
      - ./configs:/work/configs
      - ./src:/work/src
      - ./main.py:/work/main.py
    environment:
      - PYTHONUNBUFFERED=1
    command: ["sleep", "infinity"]

  train:
    build: .
    image: oww-pipeline:latest
    container_name: oww-train
    runtime: nvidia
    shm_size: 32g
    volumes:
      - ./data:/work/data
      - ./configs:/work/configs
      - ./src:/work/src
      - ./main.py:/work/main.py
    environment:
      - PYTHONUNBUFFERED=1
    command: ["sleep", "infinity"]
