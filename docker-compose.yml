name: wake-word

services:
  synth:
    build: .
    image: oww-pipeline:latest
    container_name: oww-synth
    volumes:
      - ./data:/work/data
      - ./configs:/work/configs
      - ./src:/work/src
      - ./main.py:/work/main.py
    environment:
      - PYTHONUNBUFFERED=1
    command: ["sleep", "infinity"]

  train:
    build: .
    image: oww-pipeline:latest
    container_name: oww-train
    shm_size: 32g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./data:/work/data
      - ./configs:/work/configs
      - ./src:/work/src
      - ./main.py:/work/main.py
    environment:
      - PYTHONUNBUFFERED=1
    command: ["sleep", "infinity"]
